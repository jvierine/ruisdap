[workspace]
members = ["crates/guisdap-core", "crates/guisdap-worker", "crates/guisdap-web", "crates/guisdap-ion", "crates/guisdap-millstone"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
guisdap-core = { path = "crates/guisdap-core" }
