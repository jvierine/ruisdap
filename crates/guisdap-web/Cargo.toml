[package]
name = "guisdap-web"
version.workspace = true
edition.workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
rustplotlib-web = { git = "https://github.com/jvierine/rustplotlib", rev = "be50f14ce89d2778f2db32433e7d9d27c8f53896" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
guisdap-ion = { path = "../guisdap-ion" }
guisdap-core = { path = "../guisdap-core" }
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures-util = "0.3"
web-sys = { version = "0.3", features = ["Headers", "Window", "Crypto", "Storage", "Location", "Document", "NodeList", "CanvasRenderingContext2d", "HtmlCollection", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlCanvasElement", "Event", "MouseEvent", "PointerEvent", "KeyboardEvent", "DomRect", "EventTarget", "Response", "RequestInit", "RequestCache", "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlTexture", "WebGlBuffer", "WebGlUniformLocation", "console"] }
