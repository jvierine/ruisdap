[package]
name = "ruisdap-hard-target"
version = "0.1.0"
edition = "2021"
[features]
mpi = ["dep:mpi"]
cuda = ["dep:cudarc"]
[dependencies]
mpi = { version = "0.8", optional = true }
anyhow = "1"
num-complex = "0.4"
rayon = "1"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
guisdap-signal = { path = "../guisdap-signal" }
guisdap-digital-rf = { path = "../guisdap-digital-rf" }
hdf5 = { package = "hdf5-metno", version = "0.12" }
cudarc = { version = "=0.19.10", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "cufft", "dynamic-loading", "cuda-12000"] }

guisdap-millstone = { path = "../guisdap-millstone" }

[[example]]
name = "validate_mpi"
required-features = ["mpi"]
